<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Mercearia Exclusiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
        <img src="imagens/carrinho.png" width="100">
     <a href="index.html" class="logo-link">
    <h1>Mercearia Exclusiva</h1>
    </a>
    <div class="buscar">
         <input  type="text" id="campoBusca"  placeholder="Oque você procura?">
        <button onclick="pesquisar(value)"><img src="imagens/lupa.png"class="icone"></button>
    </div>
   
      <div class="botoes">
        <button onclick="window.location.href='login.html'">Login</button>
        <button onclick="window.location.href='cadastro.html'">Cadastre-se</button>
        <button onclick="window.location.href='carrinho.html'"> <img src = "imagens/carrinho-icone.png" class="icone"></button>
    </div>
    </div>
    </header>
    <div class="container-cadastro">
        <div class="cadastro">
            <br>
        <label for="nome">Nome:</label>
            <br>
        <input type="text" id="nome" placeholder="Nome Completo">
            
         <br>
        
        <label for="usuario">Usuario:</label>
            <br>
        <input type="text" id="usuario" maxlength="14" placeholder="Minimo 6 digitos,Maximo 14">
            
         <br>
        <label for="senha">Senha:</label>
            <br>
        <input type="password" id="senha" maxlength="14" placeholder="Minimo 6 digitos,Maximo 14">
          <br>
         <label for="senha">Repita a Senha:</label>
            <br>
        <input type="password" id="senha2" placeholder="Digite novamente">
          <br>
           <label for="cpf">CPF:</label>
            <br>
        <input type="text" id="cpf" name="cpf" maxlength="14" inputmode="numeric" placeholder="000.000.000-00">
            <br>
           <label for="telefone">Telefone:</label>
            <br>
            <input type="tel" id="telefone" name="telefone" maxlength="14"placeholder="(11) 99999-9999">
            <br>
            <label for="cep">Cep:</label>
            <br>
            <input type="text" id ="cep" placeholder="00000-000" maxlength="9">
            <br>
            <label for="rua">Rua:</label>
            <br>
            <input type="text" id="rua" placeholder="Ex: Rua das Flores" maxlength="100">
            <br>
            <label for="numero">Numero da casa:</label>
            <input type="text" id="numero" placeholder="Ex: 123" maxlength="6">
        
          </div>
          <button class="botao-cadastro" onclick="cadastroUsuario()">Cadastrar</button>
        

    </div>
 
     


    <script type="module" src="utils.js"></script>
    <script type="module" src="login.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="cadastro.js"></script>
